# Banco de dados de Homologação (Railway).
# Variáveis lidas do .env: HML_MYSQLHOST, HML_MYSQLPORT, HML_MYSQLDATABASE,
# HML_MYSQLUSER, HML_MYSQLPASSWORD. No serviço de homologação do Railway, configure as
# variáveis do MySQL com esse mesmo prefixo HML_. Para acessar o mesmo banco a partir da
# máquina local (ex.: consultar dados reais), aponte essas variáveis no .env para o
# proxy público do Railway (HML_MYSQLHOST=<algo>.proxy.rlwy.net, porta pública do proxy).
spring.datasource.url=jdbc:mysql://${HML_MYSQLHOST}:${HML_MYSQLPORT}/${HML_MYSQLDATABASE}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=true&requireSSL=true
spring.datasource.username=${HML_MYSQLUSER}
spring.datasource.password=${HML_MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update

jwt.secret=${HML_JWT_SECRET}

# Front e back ficam em domínios diferentes em homologação — cookie precisa ser cross-site.
auth.cookie.secure=true
auth.cookie.samesite=None

# ==============================
# 🔹 CONFIG. DE SWAGGER/OPENAPI
# ==============================
# Homologação roda em infraestrutura pública (Railway) sem autenticação própria no Swagger —
# mesmo risco de reconhecimento de superfície de ataque que em produção, então desabilita aqui
# também (ver application-prod.properties).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==============================
# 🔹 CONFIG. DE FOCUS NFE
# ==============================
focus.nfe.token=${HML_FOCUS_NFE_TOKEN}
focus.nfe.api.url=${HML_FOCUS_NFE_API_URL}

# ==============================
# 🔹 CONFIG. DE R2 (CLOUDFLARE)
# ==============================
r2.access-key-id=${HML_R2_ACCESS_KEY_ID}
r2.secret-access-key=${HML_R2_SECRET_ACCESS_KEY}
r2.bucket-name=${HML_R2_BUCKET_NAME}

# ==============================
# 🔹 CONFIG. DO BANCO DO BRASIL (API Extratos)
# ==============================
bb.ambiente=${HML_BB_AMBIENT}
bb.app-key=${HML_BB_APP_KEY}
bb.basic=${HML_BB_BASIC}
bb.scope=${HML_BB_SCOPE}
bb.agencia=${HML_BB_AGENCIA}
bb.conta=${HML_BB_CONTA}
bb.mciteste=${HML_BB_MCITESTE:}
