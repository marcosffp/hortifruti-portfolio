spring.application.name=Hortifruti SL
# Ambiente ativo: local (padrão), hml ou prod. Troque só isso (via .env, variável de
# ambiente SPRING_PROFILES_ACTIVE, ou -Dspring.profiles.active=hml) para apontar a
# aplicação para o banco correto — veja application-local/hml/prod.properties .
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=8080
spring.config.import=optional:file:.env[.properties]

# ==============================
# 🔹 CONFIG. DE URLS
# ==============================

frontend.url=${FRONTEND_URL}
backend.url=${BACKEND_URL}

# ==============================
# 🔹 CONFIG. DE BANCO DE DADOS
# ==============================

# A URL/usuário/senha do banco (e o ddl-auto) ficam em application-{profile}.properties,
# um arquivo por ambiente — veja application-local.properties, application-hml.properties
# e application-prod.properties. Aqui só o que é comum aos três:

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Timeout do processamento assíncrono de requisições Spring MVC (ex.: POST
# /invoices/issue-with-billet/{id}, que aguarda até ~2min pela autorização da NF-e antes de
# gerar o boleto — ver IssueInvoiceWithBilletService). O padrão do Tomcat é 30s, curto demais
# para esse fluxo; sem isso o cliente recebia um 503 (AsyncRequestTimeoutException) antes da
# operação terminar.
spring.mvc.async.request-timeout=180000

# Configurações melhoradas do HikariCP
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.validation-timeout=3000
# O proxy do MySQL do Railway fecha conexões ociosas do lado dele antes do idle-timeout/max-lifetime
# acima vencerem — o pool só descobria isso ao entregar a conexão morta pra uma query real ("No
# operations allowed after connection closed"). keepalive-time faz o Hikari testar/renovar conexões
# ociosas proativamente (deve ficar menor que idle-timeout e max-lifetime). Reduzido de 150s pra 60s
# em 2026-09-06: logs de produção mostraram rajadas de "Failed to validate connection" a cada
# 15-90s (bem mais frequente que os 150s antigos), sinal de que o proxy está derrubando conexões
# mais rápido do que isso — 60s reduz a janela em que uma requisição real pode pegar a conexão já
# morta antes do keepalive detectar.
spring.datasource.hikari.keepalive-time=60000


# Testa conexões antes de usar
spring.datasource.hikari.connection-test-query=SELECT 1

# MySQL específico
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

# ==============================
# 🔹 CONFIG. DE AUTENTICAÇÃO
# ==============================

# Configuração do JWT — o segredo é por ambiente (LOCAL_JWT_SECRET, HML_JWT_SECRET,
# PROD_JWT_SECRET), ver application-{profile}.properties. Nunca compartilhar o mesmo
# segredo entre ambientes: um token assinado em hml não pode ser aceito em prod.

# Cookie HttpOnly do JWT: em local (http, mesmo "site" via localhost) Secure=false e
# SameSite=Lax bastam; hml/prod sobrescrevem para Secure=true e SameSite=None (front e
# back ficam em domínios diferentes).
auth.cookie.secure=false
auth.cookie.samesite=Lax

# Proteção contra brute-force no login: número de tentativas até acionar o lockout, e
# duração de cada nível progressivo (1º bloqueio, reincidência, 3º+ bloqueio). A
# progressão reseta após um login bem-sucedido ou após reset-after-days sem tentativas.
security.login.max-attempts=3
security.login.lockout.level1-minutes=15
security.login.lockout.level2-minutes=60
security.login.lockout.level3-minutes=1440
security.login.lockout.reset-after-days=7

# E-mails avisados quando um lockout é ativado (não a cada tentativa falha), com
# throttle para não inundar a caixa de entrada em caso de ataque prolongado.
security.login.alert.emails=${SECURITY_ALERT_EMAILS:}
security.login.alert.throttle-minutes=30



# ==============================
# 🔹 CONFIG. DE GOOGLE
# ==============================

# Configuração do Google Maps API
google.maps.api.key=${CREDENTIALS_GOOGLE}

# Configuração do Google Drive API
google.drive.credentials=${GOOGLE_DRIVE_CREDENTIALS}
# O endpoint de callback é fixo (GET /backup/oauth2callback — BackupController), então a
# URI de redirect só precisa do backend.url de cada ambiente, sem variável própria no .env.
google.redirect.uri=${backend.url}/backup/oauth2callback

#Configuração de diretório
google.temp.directory=temp/google

# Chave AES-256 (Base64) usada para criptografar em repouso as credenciais OAuth2 do Google
# salvas no banco (tabela google_oauth_tokens) — ver TokenEncryptionService. Gerar com:
# openssl rand -base64 32
google.tokens.encryption-key=${GOOGLE_TOKENS_ENCRYPTION_KEY}



# ==============================
# 🔹 CONFIG. DE SICOOB
# ==============================

# Configuração do Sicoob API
sicoob.client.id=${SICOOB_CLIENT_ID}
sicoob.api.url=${SICOOB_API_URL}
sicoob.auth.url=${SICOOB_AUTH_URL}
sicoob.scope=${SICOOB_SCOPE}
sicoob.num.cliente=${SICOOB_NUM_CLIENTE}
sicoob.num.conta.corrente=${SICOOB_NUM_CONTA_CORRENTE}

# Configuração de certificado mTLS — nome com namespace "shared" de propósito: o mesmo
# certificado e-CNPJ é reaproveitado pelo BB e pelo Sicoob/Billet (ver BBSSLConfig/BilletSSLConfig
# abaixo), então rotacionar esse certificado afeta as duas integrações, não só uma.
mtls.shared-certificate.pfx-base64=${DOCUMENT_PFX}
mtls.shared-certificate.pfx-password=${PASSWORD_PFX}
mtls.shared-certificate.pem-base64=${DOCUMENT_PEM:}

# Configuração de diretório
pfx.temp.directory=temp/cert
pem.temp.directory=temp/cert/bb_upload



# ==============================
# 🔹 CONFIG. DO BANCO DO BRASIL (API Extratos)
# ==============================

# Reaproveita o mesmo certificado mTLS (mtls.shared-certificate.*) usado no Sicoob acima.
# Credenciais (ambiente, app-key, basic, scope, agencia, conta) variam por ambiente —
# definidas em application-local.properties, application-hml.properties e
# application-prod.properties a partir de LOCAL_BB_*/HML_BB_*/PROD_BB_*.

# Somente usado quando bb.ambiente=hml
bb.mciteste=${BB_MCITESTE:}
# Evita esgotar o limite de 10 chamadas/10min da API do BB quando varios gerentes
# abrem o dashboard ao mesmo tempo.
bb.saldo.cache.ttl.seconds=120



# ==============================
# 🔹 CONFIG. DE OPENWEATHER
# ==============================

# Configurações do OpenWeather API
app.openweather.apiKey=${API_TOKEN}
app.openweather.forecastUrl=${API_URL}
app.openweather.city=Santa Luzia,MG,BR
app.openweather.units=metric
app.openweather.lang=pt_br



# ==============================
# 🔹 CONFIG. DE FOCUS NFE
# ==============================

# Configurações do Focus NFe API
# focus.nfe.token e focus.nfe.api.url variam por ambiente — definidos em
# application-local.properties, application-hml.properties e application-prod.properties.
focus.nfe.cnpj.emitente=${FOCUS_NFE_CNPJ_EMITENTE}

# Configuração de certificado
company.name=${COMPANY_NAME}
company.state.registration=${COMPANY_STATE_REGISTRATION}
company.cnpj=${COMPANY_CNPJ}
zip.password.enabled=false



# ==============================
# 🔹 CONFIG. DE NOTIFICAÇÃO
# ==============================

# Configuração do Ultramsg API
ultramsg.token=${ULTRAMSG_TOKEN}
ultramsg.instance.id=${ULTRAMSG_INSTANCE_ID}
ultramsg.base.url=https://api.ultramsg.com/

# Provedor de envio de email ativo: sendgrid | gmail | gmail-api
# Troque via variável de ambiente EMAIL_PROVIDER sem precisar alterar código.
# gmail = SMTP direto (requer porta 587/465 liberada no host de deploy)
# gmail-api = Gmail via API HTTPS, usa a mesma autorização OAuth do backup do Google Drive
email.provider=${EMAIL_PROVIDER:sendgrid}

# Configuração do SendGrid API
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:}

# Configuração do Gmail SMTP (usado quando email.provider=gmail)
gmail.smtp.host=${GMAIL_SMTP_HOST:smtp.gmail.com}
gmail.smtp.port=${GMAIL_SMTP_PORT:587}
gmail.smtp.connection-timeout-ms=${GMAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
gmail.smtp.timeout-ms=${GMAIL_SMTP_TIMEOUT_MS:10000}

username.gmail=${GMAIL:}
password.gmail=${GMAIL_PASSWORD:}

# Nome exibido na assinatura dos emails enviados a clientes
notification.sender-name=${NOTIFICATION_SENDER_NAME:}

# Configuração de Email Destinatário - Contabilidade
accounting.email=${ACCOUNTING_EMAIL}

# Configuração de WhatsApp Remetente
accounting.whatsapp=${ACCOUNTING_WHATSAPP}

# Configurações de emails Destinatários
overdue.notification.emails=${OVERDUE_NOTIFICATION_EMAILS}

# Classificação automática de transações bancárias por histórico do lançamento — nomes de
# funcionários e da família proprietária, usados para categorizar saques/PIX (ver
# TransactionCategoryClassifier). Trocar um nome aqui não exige deploy, só reiniciar a aplicação.
transaction.category.employee-names=${TRANSACTION_CATEGORY_EMPLOYEE_NAMES:alexandre c,marlucia natania vieira,amanda gabriele da silva,anderson cosme de souza,alexandre conceição dos sa}
transaction.category.family-names=${TRANSACTION_CATEGORY_FAMILY_NAMES:marcos}

# Configurações de Diretório
temp.directory=temp/notifications

# Configura o formato padrão de datas no JSON
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=America/Sao_Paulo

# ==============================
# 🔹 CONFIG. DE UPLOAD DE ARQUIVO
# ==============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Upload de foto de nota de compra (captura via câmera) — limite próprio, mais restritivo
# que o teto genérico do multipart acima, já que fotos de celular não deveriam passar disso.
nota.upload.max-size-bytes=10485760
nota.upload.temp-directory=temp/notas

# ==============================
# 🔹 CONFIG. DE CLOUDFLARE R2
# ==============================
# Todo arquivo gerado/recebido pelo sistema (boletos, notas fiscais, extratos) é
# salvo neste bucket. Cada ambiente tem sua própria conta/bucket R2 — credenciais e
# endpoint variam por ambiente, definidos em application-local.properties,
# application-hml.properties e application-prod.properties a partir de
# LOCAL_R2_*/HML_R2_*/PROD_R2_*. r2.environment só prefixa as chaves dentro do bucket
# (reaproveita SPRING_PROFILES_ACTIVE).
# ==============================
# 🔹 CONFIG. DE R2 (CLOUDFLARE)
# ==============================
r2.account-id=${R2_ACCOUNT_ID}
r2.environment=${SPRING_PROFILES_ACTIVE:local}
r2.endpoint=${R2_ENDPOINT}

# ==============================
# 🔹 CONFIG. DO GEMINI (EXTRAÇÃO DE NOTAS)
# ==============================
# Mesma chave free tier em todos os ambientes — não varia por profile.
# gemini.model: "gemini-2.5-flash" (default original da spec) já não é mais oferecido pra
# chaves novas ("no longer available to new users", 404 na API) — "gemini-flash-latest" é o
# alias estável que a Google mantém apontando pro Flash mais recente disponível.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
# Latência real do free tier variou entre ~17s e ~30s nos testes (mesma imagem, chamadas
# consecutivas) — 15000 (default original da spec) estoura quase sempre.
gemini.timeout.ms=${GEMINI_TIMEOUT_MS:60000}
# Retry só pra 503 (sobrecarga temporária do free tier, a própria API já indica que é passageiro).
# 3 tentativas com backoff exponencial a partir de 2s (2s, 4s) — outros erros (4xx, parsing) não
# são retentados, pois não são transitórios.
gemini.retry.max-tentativas=${GEMINI_RETRY_MAX_TENTATIVAS:3}
gemini.retry.espera-inicial-ms=${GEMINI_RETRY_ESPERA_INICIAL_MS:2000}

# Score mínimo (0..1) pra ProdutoMatchingService sugerir um produto do catálogo — abaixo disso
# retorna produtoSugerido null e confiança baixa em vez de forçar um match ruim (Etapa 3).
nota.matching.limiar=${NOTA_MATCHING_LIMIAR:0.6}
# Mesma ideia acima, mas pra ClienteMatchingService sugerir/pré-selecionar um cliente do cadastro a
# partir do nome lido na nota (tolera nome parcial e erro de digitação/OCR).
nota.matching.cliente.limiar=${NOTA_MATCHING_CLIENTE_LIMIAR:0.55}
nota.matching.cliente.confianca-alta=${NOTA_MATCHING_CLIENTE_CONFIANCA_ALTA:0.85}
# Mesma ideia acima, mas pra ProdutoClienteMatchingService sugerir um produto do catálogo a partir
# do NOME_PR digitado no CSV oficial do cliente (tabela de preços por competência) — texto limpo
# dos dois lados, sem os sinais de unidade/quantidade que o matching de nota tem.
nota.matching.cliente-produto.limiar=${NOTA_MATCHING_CLIENTE_PRODUTO_LIMIAR:0.6}
nota.matching.cliente-produto.confianca-alta=${NOTA_MATCHING_CLIENTE_PRODUTO_CONFIANCA_ALTA:0.85}
# Margem de tolerância (R$) pra checagem de consistência quantidade×preço vs. total (Etapa 4).
nota.consistencia.margem=${NOTA_CONSISTENCIA_MARGEM:0.05}

# ==============================
# 🔹 CONFIG. DE DISPOSITIVO VINCULADO (CAPTURA DE NOTA VIA CELULAR)
# ==============================
# Quanto tempo o código de pareamento de 6 dígitos (gerado em /pareamento/iniciar) fica válido.
dispositivo.pareamento.ttl-minutos=${DISPOSITIVO_PAREAMENTO_TTL_MINUTOS:5}
# Defesa em profundidade: um dispositivo sem uso por esse número de dias é tratado como revogado
# automaticamente na próxima tentativa de uso, mesmo que ninguém tenha revogado manualmente no PC
# (Etapa 9 da spec — mitigação pra celular perdido/roubado que nunca foi desvinculado).
dispositivo.inatividade-max-dias=${DISPOSITIVO_INATIVIDADE_MAX_DIAS:90}

# ==============================
# 🔹 CONFIG. DE HEALTH CHECK (RAILWAY)
# ==============================
# Único endpoint do Actuator exposto — /actuator/health, público (ver SecurityConfig) e sem
# detalhes (show-details=never: só UP/DOWN, sem vazar estado interno de DB/disco/etc.). Existe
# para o Railway ter um sinal de prontidão explícito (ver railway.json, healthcheckPath) em vez de
# inferir que a aplicação "subiu" só pela porta TCP abrir — a porta abre antes do Hikari/Flyway
# terminarem de inicializar, então sem isso o Railway podia rotear tráfego (ou considerar um deploy
# bem-sucedido) pra uma instância ainda não pronta para atender requisições reais.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ==============================
# 🔹 CONFIG. DE MIGRAÇÃO DE SCHEMA (FLYWAY)
# ==============================
# Substitui o mecanismo antigo de spring.sql.init.schema-locations (que só cobria 3 dos 11 scripts
# de static/*.sql, os "seguros para reexecução" — os outros 8 dependiam de alguém lembrar de rodar
# manualmente em cada ambiente, podendo divergir entre hml/prod; ver histórico do item E-C1 no
# AUDITORIA.md). Os 11 scripts foram versionados em db/migration/V1..V11 (ver esse diretório para
# o motivo de cada um ter uma guarda por INFORMATION_SCHEMA: parte deles roda antes do Hibernate
# ddl-auto=update criar a tabela num banco novo).
#
# baseline-on-migrate+baseline-version=11: em hml/prod (bancos já existentes, onde os 11 scripts
# originais já foram aplicados ao longo do tempo, manualmente ou via o mecanismo antigo), o Flyway
# só cria a tabela de histórico e marca a versão 11 como "já aplicada" — sem reexecutar nada, sem
# risco de re-rodar algo que já rodou. Num banco novo (schema vazio), o baseline não entra em
# jogo: o Flyway roda V1..V11 normalmente, na ordem, criando o histórico completo do zero (comportamento
# padrão do Flyway: baseline só atua quando já existe schema sem flyway_schema_history).
#
# ddl-auto continua "update" em todos os ambientes por enquanto (não "validate") — travar em
# "validate" exige confirmar antes, com acesso real ao banco de hml/prod, que o schema batia
# exatamente com as entidades; sem isso o risco é a aplicação não subir no próximo deploy.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=11
spring.flyway.baseline-description=Schema pre-existente ao Flyway (histórico de static/*.sql)
