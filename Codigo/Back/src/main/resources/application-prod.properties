# Banco de dados de Produção (Railway).
# Variáveis lidas do .env: PROD_MYSQLHOST, PROD_MYSQLPORT, PROD_MYSQLDATABASE,
# PROD_MYSQLUSER, PROD_MYSQLPASSWORD. No serviço de produção do Railway, configure as
# variáveis do MySQL com esse mesmo prefixo PROD_ (mesmo padrão usado em hml — veja
# application-hml.properties). Para acessar o mesmo banco a partir da máquina local
# (ex.: consultar dados reais), aponte essas variáveis no .env para o proxy público do
# Railway (PROD_MYSQLHOST=<algo>.proxy.rlwy.net, porta pública do proxy).
spring.datasource.url=jdbc:mysql://${PROD_MYSQLHOST}:${PROD_MYSQLPORT}/${PROD_MYSQLDATABASE}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=true&requireSSL=true
spring.datasource.username=${PROD_MYSQLUSER}
spring.datasource.password=${PROD_MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update

jwt.secret=${PROD_JWT_SECRET}

# Front e back ficam em domínios diferentes em produção — cookie precisa ser cross-site.
auth.cookie.secure=true
auth.cookie.samesite=None

# ==============================
# 🔹 CONFIG. DE FOCUS NFE
# ==============================
focus.nfe.token=${PROD_FOCUS_NFE_TOKEN}
focus.nfe.api.url=${PROD_FOCUS_NFE_API_URL}

# ==============================
# 🔹 CONFIG. DE SWAGGER/OPENAPI
# ==============================
# Schema completo da API não deve ficar navegável publicamente em produção.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==============================
# 🔹 CONFIG. DE R2 (CLOUDFLARE)
# ==============================
r2.access-key-id=${PROD_R2_ACCESS_KEY_ID}
r2.secret-access-key=${PROD_R2_SECRET_ACCESS_KEY}
r2.bucket-name=${PROD_R2_BUCKET_NAME}

# ==============================
# 🔹 CONFIG. DO BANCO DO BRASIL (API Extratos)
# ==============================
bb.ambiente=${PROD_BB_AMBIENT}
bb.app-key=${PROD_BB_APP_KEY}
bb.basic=${PROD_BB_BASIC}
bb.scope=${PROD_BB_SCOPE:extrato-info}
bb.agencia=${PROD_BB_AGENCIA}
bb.conta=${PROD_BB_CONTA}
bb.mciteste=${PROD_BB_MCITESTE:}